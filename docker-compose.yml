version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: rag_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: always

  backend:
    build: ./backend
    container_name: rag_backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/rag_chatbot
      - JWT_SECRET=super_secret_jwt_key_rag_chatbot_2026
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      - mongodb
    restart: always

  frontend:
    build: ./frontend
    container_name: rag_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: always

volumes:
  mongo_data:
